on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `bun fmt` and `bun lint` are only in canary builds.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary

      - name: Install dependencies
        run: bun ci

      - name: Format
        run: bun fmt --check

      - name: Lint
        run: bun lint

      - name: Unused files, exports and dependencies
        run: bun run knip

      - name: Typecheck
        run: bun run typecheck

      - name: Run unit tests
        run: bun run test
      - name: Test the packed package
        run: bun run test:package
